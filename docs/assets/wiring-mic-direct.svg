nt-size="16" fill="#e4fff0" text-anchor="end">WS</text><polyline points="320,985 660,985" fill="none" stroke="#2865c1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="320" cy="985" r="5" fill="#2865c1" stroke="#fff" stroke-width="1.5"/><circle cx="660" cy="985" r="5" fill="#2865c1" stroke="#fff" stroke-width="1.5"/><text x="674" y="991" font-size="16" fill="#e4fff0" >GPIO21</text><text x="304" y="1036" font-size="16" fill="#e4fff0" text-anchor="end">SD / DOUT</text><polyline points="320,1030 660,1030" fill="none" stroke="#b03d82" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="320" cy="1030" r="5" fill="#b03d82" stroke="#fff" stroke-width="1.5"/><circle cx="660" cy="1030" r="5" fill="#b03d82" stroke="#fff" stroke-width="1.5"/><text x="674" y="1036" font-size="16" fill="#e4fff0" >GPIO20</text><text x="304" y="1081" font-size="16" fill="#e4fff0" text-anchor="end">L/R</text><polyline points="320,1075 660,1075" fill="none" stroke="#526773" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="320" cy="1075" r="5" fill="#526773" stroke="#fff" stroke-width="1.5"/><circle cx="660" cy="1075" r="5" fill="#526773" stroke="#fff" stroke-width="1.5"/><text x="674" y="1081" font-size="16" fill="#e4fff0" >GND</text><text x="800" y="1146" font-size="19" fill="#e4fff0" text-anchor="middle">Native USB18/19</text><text x="800" y="1178" font-size="18" fill="#c4e8d0" text-anchor="middle">GPIO8/9 unused</text><text x="925" y="351" font-size="16" fill="#e4fff0" text-anchor="end">GPIO3</text><polyline points="940,345 1210,345" fill="none" stroke="#187b4a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="940" cy="345" r="5" fill="#187b4a" stroke="#fff" stroke-width="1.5"/><circle cx="1210" cy="345" r="5" fill="#187b4a" stroke="#fff" stroke-width="1.5"/><polyline points="1210,345 1280,325" fill="none" stroke="#187b4a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1300" cy="345" r="5" fill="#187b4a" stroke="#fff" stroke-width="1.5"/><polyline points="1300,345 1495,345" fill="none" stroke="#526773" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1495" cy="345" r="5" fill="#526773" stroke="#fff" stroke-width="1.5"/><text x="1150" y="311" font-size="19" fill="#187b4a" font-weight="700">UP</text><text x="925" y="451" font-size="16" fill="#e4fff0" text-anchor="end">GPIO4</text><polyline points="940,445 1210,445" fill="none" stroke="#2865c1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="940" cy="445" r="5" fill="#2865c1" stroke="#fff" stroke-width="1.5"/><circle cx="1210" cy="445" r="5" fill="#2865c1" stroke="#fff" stroke-width="1.5"/><polyline points="1210,445 1280,425" fill="none" stroke="#2865c1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1300" cy="445" r="5" fill="#2865c1" stroke="#fff" stroke-width="1.5"/><polyline points="1300,445 1495,445" fill="none" stroke="#526773" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1495" cy="445" r="5" fill="#526773" stroke="#fff" stroke-width="1.5"/><text x="1150" y="411" font-size="19" fill="#2865c1" font-weight="700">DOWN</text><text x="925" y="551" font-size="16" fill="#e4fff0" text-anchor="end">GPIO7</text><polyline points="940,545 1210,545" fill="none" stroke="#7953b6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="940" cy="545" r="5" fill="#7953b6" stroke="#fff" stroke-width="1.5"/><circle cx="1210" cy="545" r="5" fill="#7953b6" stroke="#fff" stroke-width="1.5"/><polyline points="1210,545 1280,525" fill="none" stroke="#7953b6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1300" cy="545" r="5" fill="#7953b6" stroke="#fff" stroke-width="1.5"/><polyline points="1300,545 1495,545" fill="none" stroke="#526773" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1495" cy="545" r="5" fill="#526773" stroke="#fff" stroke-width="1.5"/><text x="1150" y="511" font-size="19" fill="#7953b6" font-weight="700">LEFT</text><text x="925" y="651" font-size="16" fill="#e4fff0" text-anchor="end">GPIO10</text><polyline points="940,645 1210,645" fill="none" stroke="#bd651b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="940" cy="645" r="5" fill="#bd651b" stroke="#fff" stroke-width="1.5"/><circle cx="1210" cy="645" r="5" fill="#bd651b" stroke="#fff" stroke-width="1.5"/><polyline points="1210,645 1280,625" fill="none" stroke="#bd651b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1300" cy="645" r="5" fill="#bd651b" stroke="#fff" stroke-width="1.5"/><polyline points="1300,645 1495,645" fill="none" stroke="#526773" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1495" cy="645" r="5" fill="#526773" stroke="#fff" stroke-width="1.5"/><text x="1150" y="611" font-size="19" fill="#bd651b" font-weight="700">RIGHT</text><text x="925" y="751" font-size="16" fill="#e4fff0" text-anchor="end">GPIO1</text><polyline points="940,745 1210,745" fill="none" stroke="#b03d82" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="940" cy="745" r="5" fill="#b03d82" stroke="#fff" stroke-width="1.5"/><circle cx="1210" cy="745" r="5" fill="#b03d82" stroke="#fff" stroke-width="1.5"/><polyline points="1210,745 1280,725" fill="none" stroke="#b03d82" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1300" cy="745" r="5" fill="#b03d82" stroke="#fff" stroke-width="1.5"/><polyline points="1300,745 1495,745" fill="none" stroke="#526773" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1495" cy="745" r="5" fill="#526773" stroke="#fff" stroke-width="1.5"/><text x="1150" y="711" font-size="19" fill="#b03d82" font-weight="700">SELECT</text><polyline points="1495,330 1495,800 940,800" fill="none" stroke="#526773" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1495" cy="800" r="5" fill="#526773" stroke="#fff" stroke-width="1.5"/><circle cx="940" cy="800" r="5" fill="#526773" stroke="#fff" stroke-width="1.5"/><text x="925" y="806" font-size="16" fill="#e4fff0" text-anchor="end">GND</text><text x="1410" y="830" font-size="16" fill="#273b47" >COMMON GND</text><text x="1000" y="865" font-size="18" fill="#166b49" font-weight="700">All five switches stay on GPIO.</text><text x="1000" y="900" font-size="17" fill="#273b47" >Other switch contact goes to GND.</text><text x="1000" y="935" font-size="17" fill="#273b47" >INPUT_PULLUP; no button resistors.</text><text x="1000" y="1000" font-size="17" fill="#995b16" >* GPIO2 is a boot strapping pin.</text><text x="1000" y="1035" font-size="17" fill="#273b47" >Only mic SCK (an input) uses it.</text><text x="1000" y="1070" font-size="17" fill="#995b16" >Fit the pullup shown below.</text><text x="80" y="1180" font-size="16" fill="#273b47" >CHIPEN: tie to 3V3 if exposed.</text><text x="80" y="1211" font-size="16" fill="#273b47" >Most breakouts already do this.</text><rect x="64" y="1280" width="1470" height="340" rx="10" fill="#f7fafb" stroke="#c7d7de" stroke-width="2"/><text x="88" y="1320" font-size="22" fill="#214b3a" font-weight="700">SUPPORT COMPONENTS / LABELS JOIN THE SIGNALS ABOVE</text><text x="130" y="1366" font-size="18" fill="#ca3e46" >3V3</text><polyline points="175,1375 175,1388" fill="none" stroke="#ca3e46" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="175,1388 175,1412" fill="none" stroke="#526773" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="162" y="1412" width="26" height="62" rx="1" fill="#fff" stroke="#8c6740" stroke-width="2"/><polyline points="175,1474 175,1508" fill="none" stroke="#526773" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="1450" font-size="17" fill="#8c6740" >10k REQUIRED</text><polyline points="175,1508 175,1537" fill="none" stroke="#926229" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="130" y="1568" font-size="17" fill="#926229" >GPIO2 / SCK</text><text x="570" y="1366" font-size="18" fill="#b03d82" >GPIO20 / SD</text><polyline points="615,1375 615,1388" fill="none" stroke="#b03d82" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="615,1388 615,1412" fill="none" stroke="#526773" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="602" y="1412" width="26" height="62" rx="1" fill="#fff" stroke="#8c6740" stroke-width="2"/><polyline points="615,1474 615,1508" fill="none" stroke="#526773" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="640" y="1450" font-size="17" fill="#8c6740" >100k pulldown</text><polyline points="615,1508 615,1537" fill="none" stroke="#526773" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="590" y="1568" font-size="17" fill="#273b47" >GND</text><text x="1105" y="1366" font-size="18" fill="#ca3e46" >3V3</text><polyline points="1150,1375 1150,1440" fill="none" stroke="#ca3e46" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1125,1440 1175,1440" fill="none" stroke="#526773" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1125,1455 1175,1455" fill="none" stroke="#526773" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1150,1455 1150,1537" fill="none" stroke="#526773" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1188" y="1454" font-size="17" fill="#273b47" >100 nF</text><text x="1125" y="1568" font-size="17" fill="#273b47" >GND</text><text x="1090" y="1598" font-size="15" fill="#273b47" >Near mic VDD</text><text x="90" y="1598" font-size="15" fill="#273b47" >Check breakout-fitted SD pulldown and bypass capacitor before adding duplicates.</text><text x="65" y="1660" font-size="17" fill="#273b47" >Logical net map, not physical header positions. All power is 3.3 V; all grounds join.</text><text x="65" y="1694" font-size="15" fill="#995b16" >Flash with microphone disconnected, unplug power, then wire this circuit. Hardware audio/boot tests pending.</text></g></svg>
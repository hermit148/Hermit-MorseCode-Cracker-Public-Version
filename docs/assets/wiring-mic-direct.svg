<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1750" viewBox="0 0 1600 1750" role="img"><title>INMP441 microphone with five direct buttons and no expander</title><desc>GPIO2 SCK with required 10k pullup, WS21, SD20, OLED5/0, buzzer6 and five buttons3/4/7/10/1. Native USB18/19 stays free.</desc><g font-family="Consolas,DejaVu Sans Mono,monospace"><rect x="0" y="0" width="1600" height="1750" rx="0" fill="#f4f8fa" stroke="#f4f8fa" stroke-width="2"/><rect x="28" y="28" width="1544" height="1694" rx="16" fill="#fff" stroke="#ccdce2" stroke-width="2"/><text x="64" y="80" font-size="28" fill="#164e36" font-weight="700">HERMIT'S MORSE CRACKER / MIC + DIRECT BUTTONS</text><text x="64" y="116" font-size="19" fill="#273b47" >ESP32-C3 + OLED + INMP441 + five direct buttons + passive piezo.</text><text x="64" y="151" font-size="18" fill="#166b49" >Firmware: Hermits-Morse-Cracker-C3-Mic-Direct-Buttons.bin | offset 0x0</text><text x="64" y="188" font-size="18" fill="#995b16" >Required: 10k pullup GPIO2 to 3V3. Power off before wiring; follow GPIO labels.</text><rect x="660" y="255" width="280" height="970" rx="10" fill="#12472f" stroke="#12472f" stroke-width="2"/><text x="800" y="289" font-size="27" fill="#e4fff0" text-anchor="middle" font-weight="700">ESP32-C3</text><rect x="80" y="255" width="240" height="235" rx="10" fill="#113a48" stroke="#113a48" stroke-width="2"/><text x="200" y="290" font-size="22" fill="#e4fff0" text-anchor="middle">SSD1306 OLED</text><text x="304" y="336" font-size="16" fill="#e4fff0" text-anchor="end">VCC</text><polyline points="320,330 660,330" fill="none" stroke="#ca3e46" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="320" cy="330" r="5" fill="#ca3e46" stroke="#fff" stroke-width="1.5"/><circle cx="660" cy="330" r="5" fill="#ca3e46" stroke="#fff" stroke-width="1.5"/><text x="674" y="336" font-size="16" fill="#e4fff0" >3V3</text><text x="304" y="381" font-size="16" fill="#e4fff0" text-anchor="end">GND</text><po
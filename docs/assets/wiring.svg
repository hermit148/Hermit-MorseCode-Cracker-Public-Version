ke="#fff" stroke-width="2"/><text x="477" y="640" font-size="18" fill="#a24d0a" text-anchor="middle">220 Ω</text><text x="606" y="677" font-size="18" fill="#e8fff2" >GPIO6</text><polyline points="390,755 420,755 420,940 1440,940" fill="none" stroke="#566675" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="390" cy="755" r="6" fill="#566675" stroke="#fff" stroke-width="2"/><circle cx="1440" cy="940" r="6" fill="#566675" stroke="#fff" stroke-width="2"/><text x="74" y="161" font-size="15" fill="#6b4d20" >Use a GPIO-rated 3.3 V passive piezo. Other sounders require a suitable driver (see the wiring guide).</text><rect x="965" y="790" width="415" height="105" rx="10" fill="#eef8f1" stroke="#a3cfb1" stroke-width="2"/><text x="986" y="821" font-size="19" fill="#20533b" font-weight="700">BUTTONS: INPUT_PULLUP</text><text x="986" y="849" font-size="16" fill="#375c49" >Released HIGH · pressed LOW</text><text x="986" y="875" font-size="14" fill="#375c49" >Use contacts from different switch pairs.</text><text x="74" y="997" font-size="17" fill="#3a5260" >GPIO labels are logical connections, not physical header positions. All grounds join ESP32 GND.</text><text x="74" y="1028" font-size="16" fill="#5a6d79" >GPIO18/19 reserved for native USB; boot GPIO2/8/9 unused. Disconnect power before wiring.</text><text x="1525" y="1057" font-size="14" fill="#16824b" text-anchor="end" font-weight="700">MADE BY HERMIT AKA ASHWIN</text></g></svg>